<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Дмитрий & Софья</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#f5f5f5;
}

.wrapper{
    position:relative;
    width:100%;
    max-width:390px;
    margin:0 auto;
}

.invite{
    display:block;
    width:100%;
    height:auto;
}

/* Кнопка карты */
.map-link{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    top:38.5%;
    width:42%;
    height:0.7%;
    z-index:10;
}

/* Кнопка анкеты */
.form-link{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    top:82.8%;
    width:42%;
    height:1%;
    z-index:10;
}

a{
    display:block;
}
</style>
</head>

<body>

<div class="wrapper">

    <img class="invite" src="invite.png" alt="Свадебное приглашение">

    <a
        class="map-link"
        href="https://yandex.ru/navi?whatshere%5Bzoom%5D=19&whatshere%5Bpoint%5D=37.348932,55.572341&si=q7w3vc6m8gw03g1zmnhywg5wgw"
        target="_blank">
    </a>

    <a
        class="form-link"
        href="https://forms.yandex.ru/u/6a2432cbeb614629d465316d"
        target="_blank">
    </a>

</div>

</body>
</html>
